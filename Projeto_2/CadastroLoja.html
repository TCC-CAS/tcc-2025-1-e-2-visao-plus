<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Loja</title>
    <link rel="stylesheet" href="css/pages/CadastroLoja.css">
</head>

<body>

    <div id="app-header"></div>

    <h1>Solicitação de Abertura de Loja</h1>

    <form id="cadastroLojaForm">

        <label for="cnpj">CNPJ:</label>
        <input type="text" id="cnpj" name="cnpj" required>
        <button type="button" id="btnBuscarCnpj">Buscar dados do CNPJ</button>

        <label for="nome">Nome da loja:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">Email da Loja:</label>
        <input type="email" id="email" name="email">

        <label for="cep">CEP:</label>
        <input type="text" id="cep" name="cep">

        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" name="endereco">

        <label for="descricao">Descrição:</label>
        <textarea id="descricao" name="descricao" maxlength="500"></textarea>

        <button type="submit">Enviar solicitação</button>
    </form>
    <script type="module" src="JS/pages/CadastroLoja.js"></script>
</body>

</html>
